<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Thùng rác thông minh{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb;
          --b1:#2563eb; --b2:#16a34a; --b3:#6b7280; --rej:#dc2626; --err:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#111827; color:#fff; padding:12px 16px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header b { font-size:17px; }
  header a { color:#cbd5e1; text-decoration:none; } header a.on, header a:hover { color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; margin:20px 0 10px; }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .big { font-size:28px; font-weight:700; } .muted { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; color:#fff; font-size:12px; white-space:nowrap; }
  .t-1 { background:var(--b1); } .t-2 { background:var(--b2); } .t-3 { background:var(--b3); }
  .t-REJECT { background:var(--rej); } .t-ERROR { background:var(--err); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .on-dot { background:#16a34a; } .off-dot { background:#9ca3af; }
  .events { display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .ev { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; color:inherit; text-decoration:none; }
  .ev img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#ddd; }
  .ev div { padding:8px; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--card); font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  td img { width:64px; height:48px; object-fit:cover; border-radius:4px; }
  .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px; }
  .bar span:first-child { width:120px; flex-shrink:0; }
  .bar i { display:block; height:16px; background:var(--b1); border-radius:3px; min-width:2px; }
  form.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  form.filters select, form.filters input, form.filters button { padding:6px 8px; font-size:14px; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <b>♻ Thùng rác thông minh</b>
  <a href="/" class="{{ 'on' if request.path == '/' }}">Tổng quan</a>
  <a href="/events" class="{{ 'on' if request.path.startswith('/events') }}">Lịch sử</a>
  <a href="/stats" class="{{ 'on' if request.path == '/stats' }}">Thống kê</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
