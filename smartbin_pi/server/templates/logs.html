{% extends "base.html" %}
{% block title %}Log thiết bị{% endblock %}
{% block head %}
<style>
  .bar-top { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .bar-top select, .bar-top input, .bar-top button { padding:6px 8px; font-size:14px; }
  #log { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:10px; height:calc(100vh - 190px);
         min-height:300px; overflow:auto; font:12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #log div { white-space:pre-wrap; word-break:break-word; }
  #log .t { color:#64748b; } #log .n { color:#94a3b8; }
  #log .DEBUG { color:#94a3b8; } #log .WARNING { color:#fbbf24; }
  #log .ERROR, #log .CRITICAL { color:#f87171; }
  #log .hide { display:none; }
</style>
{% endblock %}
{% block body %}
{% if not device %}
<p class="muted">Chưa có thiết bị nào kết nối. Chạy <code>main.py</code> trên Pi (không dùng <code>--no-upload</code>).</p>
{% else %}
<div class="bar-top">
  <select id="dev" onchange="location.search = '?device=' + encodeURIComponent(this.value)">
    {% for i in ids %}<option {{ 'selected' if i == device }}>{{ i }}</option>{% endfor %}
  </select>
  <select id="lvl">
    <option value="0">Mọi mức</option><option value="1" selected>INFO trở lên</option>
    <option value="2">WARNING trở lên</option><option value="3">Chỉ lỗi</option>
  </select>
  <input id="q" placeholder="Lọc theo chữ…" style="flex:1 1 160px;">
  <button id="pause">Tạm dừng</button>
  <button id="clear">Xoá màn hình</button>
  <span class="muted"><span class="dot off-dot" id="dot"></span><span id="state">Đang nối…</span></span>
</div>
<div id="log"></div>
<script>
const dev = {{ device | tojson }}, box = document.getElementById("log");
const RANK = {DEBUG: 0, INFO: 1, WARNING: 2, ERROR: 3, CRITICAL: 3}, MAX_LINES = 3000;
let seq = 0, paused = false;
const lvl = document.getElementById("lvl"), q = document.getElementById("q");
try { lvl.value = localStorage.getItem("logLevel") || "1"; } catch (e) {}

function visible(el) {
  const t = q.value.trim().toLowerCase();
  return RANK[el.dataset.level] >= +lvl.value && (!t || el.textContent.toLowerCase().includes(t));
}
function refilter() {
  for (const el of box.children) el.classList.toggle("hide", !visible(el));
  box.scrollTop = box.scrollHeight;
}
lvl.onchange = () => { try { localStorage.setItem("logLevel", lvl.value); } catch (e) {} refilter(); };
q.oninput = refilter;
document.getElementById("pause").onclick = e => {
  paused = !paused; e.target.textContent = paused ? "Tiếp tục" : "Tạm dừng";
};
document.getElementById("clear").onclick = () => { box.innerHTML = ""; };

function hms(ts) {
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
}
function add(ln) {
  const el = document.createElement("div");
  el.className = ln.level; el.dataset.level = ln.level;
  const t = document.createElement("span"); t.className = "t"; t.textContent = hms(ln.ts) + " ";
  const n = document.createElement("span"); n.className = "n"; n.textContent = `${ln.level.padEnd(7)} ${ln.name}: `;
  el.append(t, n, document.createTextNode(ln.msg));
  el.classList.toggle("hide", !visible(el));
  box.appendChild(el);
}
async function poll() {
  if (!paused) {
    try {
      const r = await (await fetch(`/api/logs/${encodeURIComponent(dev)}?after=${seq}`, {cache: "no-store"})).json();
      if (r.seq < seq) seq = 0;                       // server khởi động lại
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      r.lines.forEach(add);
      seq = r.seq;
      while (box.children.length > MAX_LINES) box.firstChild.remove();
      if (atBottom && r.lines.length) box.scrollTop = box.scrollHeight;
      document.getElementById("dot").className = "dot " + (r.online ? "on-dot" : "off-dot");
      document.getElementById("state").textContent = r.online ? "Đang nhận log" : "Thiết bị không gửi log";
    } catch (e) { document.getElementById("state").textContent = "Mất kết nối server"; }
  }
  setTimeout(poll, 1000);
}
poll();
</script>
{% endif %}
{% endblock %}
